<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - El Túnel</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f4f1ea; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 300px; 
            text-align: center; 
            border-top: 5px solid #8b0000; 
        }
        .logo-titulo { 
            font-size: 2rem; 
            font-weight: bold; 
            color: #4a2e18; 
            font-family: Georgia, serif; 
            font-style: italic; 
            margin-bottom: 20px; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #4a2e18; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background-color: #2e1c0e; 
        }
        .volver { 
            margin-top: 15px; 
            display: block; 
            color: #8b0000; 
            text-decoration: none; 
            font-size: 0.9rem; 
        }
        .volver:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-titulo">El Túnel</div>
        <h3>Iniciar Sesión</h3>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="verificarLogin()">Entrar</button>
        <a href="index.html" class="volver">← Volver a la página principal</a>
    </div>

    <script>
        function verificarLogin() {
            let u = document.getElementById("usuario").value;
            let p = document.getElementById("pass").value;

            // Validación de usuarios, roles y contraseña 
            if (u === "Astro1" && p === "biblioteca123") {
                window.location.href = "admin.html";
            } else if (u === "Astro9" && p === "biblioteca123") {
                window.location.href = "empleado.html";
            } else if (u === "Astro99" && p === "biblioteca123") {
                window.location.href = "cliente.html";
            } else {
                alert("Contraseña o usuario incorrecto");
            }
        }
    </script>
</body>
</html>
